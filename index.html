<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NBS Poly Clinic Management System</title>
  
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #f4f7f6; margin: 0; padding: 15px; color: #333; }
    .header { text-align: center; margin-bottom: 20px; }
    .header h1 { color: #0284c7; margin: 5px 0; }
    .nav-tabs { display: flex; gap: 10px; margin-bottom: 20px; justify-content: center; }
    .nav-tabs button { padding: 10px 20px; border: none; background: #cbd5e1; border-radius: 8px; cursor: pointer; font-weight: bold; }
    .nav-tabs button.active { background: #0284c7; color: white; }
    .card { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px; }
    .form-group { margin-bottom: 12px; }
    label { display: block; font-weight: 600; margin-bottom: 5px; }
    input, select, textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; }
    .btn { background: #0284c7; color: white; padding: 10px 15px; border: none; border-radius: 6px; cursor: pointer; font-size: 15px; }
    .btn:hover { background: #0369a1; }
    .pending-item { border-left: 4px solid #f59e0b; padding: 12px; margin-bottom: 10px; background: #fffbeb; border-radius: 4px; }
    .completed-item { border-left: 4px solid #10b981; padding: 12px; margin-bottom: 10px; background: #ecfdf5; border-radius: 4px; }
    .badge { display: inline-block; padding: 4px 8px; border-radius: 12px; font-size: 12px; font-weight: bold; }
    .badge-pending { background: #fef3c7; color: #b45309; }
    .badge-completed { background: #d1fae5; color: #065f46; }
  </style>
</head>
<body>

  <div class="header">
    <h1>NBS Poly Clinic</h1>
    <p>Doctor & Pathology Real-Time Sync Portal</p>
  </div>

  <div class="nav-tabs">
    <button id="tabDoctorBtn" class="active" onclick="switchTab('doctor')">Doctor Portal</button>
    <button id="tabLabBtn" onclick="switchTab('lab')">Pathology Lab</button>
  </div>

  <!-- DOCTOR SECTION -->
  <div id="doctorSection">
    <div class="card">
      <h3>Add Patient & Prescribe Test</h3>
      <div class="form-group">
        <label>Patient ID / Mobile Number:</label>
        <input type="text" id="patientId" placeholder="e.g. 9876543210">
      </div>
      <div class="form-group">
        <label>Patient Name:</label>
        <input type="text" id="patientName" placeholder="e.g. Rahul Sharma">
      </div>
      <div class="form-group">
        <label>Advised Tests (Comma separated):</label>
        <input type="text" id="testsAdvised" placeholder="e.g. CBC, Lipid Profile, Urine">
      </div>
      <div class="form-group">
        <label>Clinical Notes / Symptoms:</label>
        <textarea id="notes" rows="2" placeholder="Fever, weakness..."></textarea>
      </div>
      <button class="btn" onclick="submitClinicalVisit()">Send to Lab (Sync Live)</button>
    </div>

    <div class="card">
      <h3>Completed Lab Reports (Live Auto-Update)</h3>
      <div id="doctorReportsList">
        <p style="color: #666;">No reports uploaded yet.</p>
      </div>
    </div>
  </div>

  <!-- PATHOLOGY SECTION -->
  <div id="labSection" style="display: none;">
    <div class="card">
      <h3>Pending Tests From Doctor (Live Sync)</h3>
      <div id="labPendingList">
        <p style="color: #666;">No pending tests from doctor.</p>
      </div>
    </div>
  </div>

  <script>
    // 1. Firebase Configuration
    const firebaseConfig = {
      apiKey: "AIzaSyBeSB_UJsWo1hYav9VCk3Srk67p4",
      authDomain: "nbs-poly-clinic.firebaseapp.com",
      projectId: "nbs-poly-clinic",
      storageBucket: "nbs-poly-clinic.appspot.com",
      messagingSenderId: "836155988202",
      appId: "1:836155988202:web:0419cb6ee23fb1",
      measurementId: "G-6FKEMC96WB"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // 2. Tab Navigation
    function switchTab(tab) {
      if (tab === 'doctor') {
        document.getElementById('doctorSection').style.display = 'block';
        document.getElementById('labSection').style.display = 'none';
        document.getElementById('tabDoctorBtn').classList.add('active');
        document.getElementById('tabLabBtn').classList.remove('active');
      } else {
        document.getElementById('doctorSection').style.display = 'none';
        document.getElementById('labSection').style.display = 'block';
        document.getElementById('tabDoctorBtn').classList.remove('active');
        document.getElementById('tabLabBtn').classList.add('active');
      }
    }

    // 3. DOCTOR: Add Patient Visit and Send to Lab
    async function submitClinicalVisit() {
      const pId = document.getElementById('patientId').value.trim();
      const pName = document.getElementById('patientName').value.trim();
      const pTests = document.getElementById('testsAdvised').value.trim();
      const pNotes = document.getElementById('notes').value.trim();

      if (!pId || !pName || !pTests) {
        alert("Kripya Patient ID, Name aur Tests bharein!");
        return;
      }

      try {
        await db.collection("visits").add({
          patientId: pId,
          patientName: pName,
          tests: pTests,
          notes: pNotes,
          status: "pending_lab",
          timestamp: firebase.firestore.FieldValue.serverTimestamp()
        });

        alert("Patient record lab ko live bhej diya gaya!");
        document.getElementById('patientId').value = '';
        document.getElementById('patientName').value = '';
        document.getElementById('testsAdvised').value = '';
        document.getElementById('notes').value = '';
      } catch (err) {
        alert("Error: " + err.message);
      }
    }

    // 4. PATHOLOGY: Listen for Realtime Pending Tests
    function startLabRealtimeSync() {
      db.collection("visits")
        .where("status", "==", "pending_lab")
        .onSnapshot((snapshot) => {
          const container = document.getElementById('labPendingList');
          if (snapshot.empty) {
            container.innerHTML = "<p style='color:#666;'>Koi pending lab test nahi hai.</p>";
            return;
          }

          let html = "";
          snapshot.forEach((doc) => {
            const data = doc.data();
            html += `
              <div class="pending-item">
                <p><strong>Patient ID:</strong> ${data.patientId} | <strong>Name:</strong> ${data.patientName}</p>
                <p><strong>Tests Advised:</strong> <span style="color:#d97706; font-weight:bold;">${data.tests}</span></p>
                <p><strong>Doctor Notes:</strong> ${data.notes || 'None'}</p>
                
                <div style="margin-top: 10px;">
                  <input type="text" id="reportResult_${doc.id}" placeholder="Enter lab findings / report values" style="margin-bottom:8px;">
                  <button class="btn" style="background:#10b981;" onclick="submitReport('${doc.id}', '${data.patientId}', '${data.patientName}', '${data.tests}')">Submit Report</button>
                </div>
              </div>
            `;
          });
          container.innerHTML = html;
        });
    }

    // 5. PATHOLOGY: Submit Completed Report
    async function submitReport(visitId, pId, pName, testName) {
      const resultVal = document.getElementById('reportResult_' + visitId).value.trim();
      if (!resultVal) {
        alert("Report details likhiye!");
        return;
      }

      try {
        await db.collection("reports").add({
          visitId: visitId,
          patientId: pId,
          patientName: pName,
          testName: testName,
          result: resultVal,
          completedAt: firebase.firestore.FieldValue.serverTimestamp()
        });

        await db.collection("visits").doc(visitId).update({
          status: "completed"
        });

        alert("Report complete ho kar doctor ke dashboard par update ho gayi!");
      } catch (err) {
        alert("Error submitting report: " + err.message);
      }
    }

    // 6. DOCTOR: Listen for Realtime Completed Reports
    function startDoctorReportsSync() {
      db.collection("reports")
        .orderBy("completedAt", "desc")
        .onSnapshot((snapshot) => {
          const container = document.getElementById('doctorReportsList');
          if (snapshot.empty) {
            container.innerHTML = "<p style='color:#666;'>No reports completed yet.</p>";
            return;
          }

          let html = "";
          snapshot.forEach((doc) => {
            const data = doc.data();
            html += `
              <div class="completed-item">
                <p><strong>Patient ID:</strong> ${data.patientId} | <strong>Name:</strong> ${data.patientName} <span class="badge badge-completed">Report Ready</span></p>
                <p><strong>Test:</strong> ${data.testName}</p>
                <p><strong>Lab Findings / Result:</strong> ${data.result}</p>
              </div>
            `;
          });
          container.innerHTML = html;
        });
    }

    // Initialize listeners
    startLabRealtimeSync();
    startDoctorReportsSync();
  </script>
</body>
</html>
